services:
  postgres:
    image: postgres:15-alpine
    container_name: p07-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:-p07}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-p07pass}
      POSTGRES_DB: ${DB_DATABASE:-p07_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: p07-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  pgdata:
